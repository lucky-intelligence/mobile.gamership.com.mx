version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "@lucky-intelligence:registry=https://npm.pkg.github.com" > .npmrc
        - echo "//://github.com\${NPM_TOKEN}" >> .npmrc
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*